<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elevator Guard - Dashboard</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #eee;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container { max-width: 960px; margin: 0 auto; }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(90deg, #4caf50, #2196f3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: #888;
            margin-top: 6px;
            font-size: 0.9rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .card .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .card .valor {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .status-normal { color: #4caf50; }
        .status-atencao { color: #ff9800; }
        .status-critico { color: #f44336; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
        }

        .chart-container h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: #ccc;
        }

        canvas { width: 100% !important; }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.75rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Elevator Guard</h1>
            <p>Sentinela contra Dengue &mdash; Monitoramento em Tempo Real</p>
        </div>

        <div hx-get="/dados" hx-trigger="every 2s" hx-swap="innerHTML">
            {% include 'partials/dados.html' %}
        </div>

        <div class="chart-container">
            <h2>Histórico de Leituras</h2>
            <canvas id="grafico" height="120"></canvas>
        </div>

        <div class="footer">
            Cesar School &mdash; Sistemas Embarcados 2026 | ESP32 + MQTT + Flask
        </div>
    </div>

    <script>
        const ctx = document.getElementById('grafico').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    {
                        label: 'Nível (cm)',
                        data: [],
                        borderColor: '#4caf50',
                        backgroundColor: 'rgba(76, 175, 80, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 3,
                        pointBackgroundColor: '#4caf50'
                    },
                    {
                        label: 'Umidade (%)',
                        data: [],
                        borderColor: '#2196f3',
                        backgroundColor: 'rgba(33, 150, 243, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 3,
                        pointBackgroundColor: '#2196f3'
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        labels: { color: '#aaa', font: { family: 'Inter' } }
                    }
                },
                scales: {
                    x: {
                        ticks: { color: '#666', maxTicksLimit: 10 },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: { color: '#666' },
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    }
                }
            }
        });

        setInterval(async () => {
            const res = await fetch('/api/historico');
            const dados = await res.json();
            chart.data.labels = dados.map(d => d.timestamp);
            chart.data.datasets[0].data = dados.map(d => d.nivel_cm);
            chart.data.datasets[1].data = dados.map(d => d.umidade);
            chart.update();
        }, 3000);
    </script>
</body>
</html>
